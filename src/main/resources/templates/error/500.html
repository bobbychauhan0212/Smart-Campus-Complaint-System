<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Internal Error (500)')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-auto py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
                <div class="text-warning mb-3">
                    <i class="fa-solid fa-triangle-exclamation display-1"></i>
                </div>
                <h2 class="fw-bold text-dark mb-2">500 - Server Error</h2>
                <p class="text-muted mb-4">
                    An unexpected server error occurred while processing your request. Please try again or contact system support.
                </p>
                <div>
                    <a th:href="@{/}" class="btn btn-primary rounded-pill px-4">
                        <i class="fa-solid fa-house me-2"></i> Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
