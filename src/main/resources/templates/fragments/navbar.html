<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container-fluid px-lg-4">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <i class="fa-solid fa-graduation-cap text-warning me-2 fs-4"></i>
            <span>CampusResolve</span>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" 
                aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarMain">
            <!-- Student Navigation Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3" sec:authorize="hasRole('ROLE_STUDENT')">
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center" th:href="@{/student/dashboard}">
                        <i class="fa-solid fa-chart-pie me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center" th:href="@{/student/complaints/new}">
                        <i class="fa-solid fa-plus-circle me-2"></i> Raise Complaint
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center" th:href="@{/student/complaints}">
                        <i class="fa-solid fa-list-check me-2"></i> My Complaints
                    </a>
                </li>
            </ul>

            <!-- Admin Navigation Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3" sec:authorize="hasRole('ROLE_ADMIN')">
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center" th:href="@{/admin/dashboard}">
                        <i class="fa-solid fa-gauge-high me-2"></i> Admin Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center" th:href="@{/admin/complaints}">
                        <i class="fa-solid fa-folder-open me-2"></i> All Complaints
                    </a>
                </li>
            </ul>

            <!-- Right-Side User Profile & Logout -->
            <ul class="navbar-nav ms-auto align-items-center" sec:authorize="isAuthenticated()">
                <li class="nav-item me-3">
                    <span class="badge bg-light text-dark px-3 py-2 rounded-pill fw-semibold">
                        <i class="fa-solid fa-user me-1 text-primary"></i>
                        <span sec:authentication="name">User</span>
                        <span class="ms-1 text-muted fw-normal" sec:authorize="hasRole('ROLE_STUDENT')">(Student)</span>
                        <span class="ms-1 text-muted fw-normal" sec:authorize="hasRole('ROLE_ADMIN')">(Admin)</span>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                        </button>
                    </form>
                </li>
            </ul>
            
            <ul class="navbar-nav ms-auto" sec:authorize="!isAuthenticated()">
                <li class="nav-item">
                    <a class="btn btn-warning btn-sm rounded-pill px-3 fw-bold" th:href="@{/login}">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Login
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
