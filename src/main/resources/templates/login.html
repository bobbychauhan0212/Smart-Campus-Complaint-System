<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Login')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-auto py-5">
    <div class="auth-container">
        
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">CampusResolve</h3>
                <p class="text-muted small">Student Complaint Management Portal</p>
            </div>

            <!-- Role Selection Tabs -->
            <ul class="nav nav-pills nav-justified mb-4 p-1 bg-light rounded-3 border" role="tablist">
                <li class="nav-item" role="presentation">
                    <a th:classappend="${activeTab == 'admin' ? '' : 'active fw-bold'}"
                       class="nav-link text-center py-2" 
                       th:href="@{/student/login}">
                        <i class="fa-solid fa-user-graduate me-1"></i> Student
                    </a>
                </li>
                <li class="nav-item" role="presentation">
                    <a th:classappend="${activeTab == 'admin' ? 'active fw-bold' : ''}"
                       class="nav-link text-center py-2" 
                       th:href="@{/admin/login}">
                        <i class="fa-solid fa-user-gear me-1"></i> Admin
                    </a>
                </li>
            </ul>

            <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control" id="username" name="username" 
                               placeholder="name@college.edu" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="mb-0 text-muted small">New Student? 
                    <a th:href="@{/register}" class="text-primary text-decoration-none fw-semibold">
                        Register Account Here
                    </a>
                </p>
            </div>



        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
