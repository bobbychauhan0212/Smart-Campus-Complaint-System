# Server Configuration
server.port=8080

# Application Name
spring.application.name=student-complaint-management

# MySQL Database Configuration
# Note: Change username and password below to match your local MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/student_complaint_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Bobby@1202
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Security & Static Asset Caching
spring.web.resources.static-locations=classpath:/static/
