<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Student Registration')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white p-4">
                    <h4 class="mb-1 text-white fw-bold"><i class="fa-solid fa-user-plus me-2"></i> Student Registration</h4>
                    <p class="mb-0 text-white-50 small">Create your student account to raise and track complaints</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/register}" th:object="${studentDto}" method="post" class="needs-validation" novalidate>
                        
                        <div class="row g-3">
                            <!-- Full Name -->
                            <div class="col-md-12">
                                <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control" id="name" 
                                       placeholder="e.g. John Doe" 
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    Name is required
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                <input type="email" th:field="*{email}" class="form-control" id="email" 
                                       placeholder="student@college.edu" 
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    Valid email required
                                </div>
                            </div>

                            <!-- Roll Number -->
                            <div class="col-md-6">
                                <label for="rollNo" class="form-label">Roll Number / Student ID <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{rollNo}" class="form-control" id="rollNo" 
                                       placeholder="e.g. CS2026-042" 
                                       th:classappend="${#fields.hasErrors('rollNo')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('rollNo')}" th:errors="*{rollNo}">
                                    Roll number required
                                </div>
                            </div>

                            <!-- Department -->
                            <div class="col-md-6">
                                <label for="department" class="form-label">Department <span class="text-danger">*</span></label>
                                <select th:field="*{department}" class="form-select" id="department" 
                                        th:classappend="${#fields.hasErrors('department')} ? 'is-invalid' : ''" required>
                                    <option value="">Select Department...</option>
                                    <option value="Computer Science">Computer Science &amp; Engineering</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Electrical Engineering">Electrical Engineering</option>
                                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                                    <option value="Civil Engineering">Civil Engineering</option>
                                    <option value="Business Administration">Business Administration</option>
                                    <option value="Biotechnology">Biotechnology</option>
                                    <option value="Other">Other</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('department')}" th:errors="*{department}">
                                    Department is required
                                </div>
                            </div>

                            <!-- Academic Year -->
                            <div class="col-md-6">
                                <label for="year" class="form-label">Academic Year <span class="text-danger">*</span></label>
                                <select th:field="*{year}" class="form-select" id="year" 
                                        th:classappend="${#fields.hasErrors('year')} ? 'is-invalid' : ''" required>
                                    <option value="">Select Year...</option>
                                    <option value="1">1st Year (Freshman)</option>
                                    <option value="2">2nd Year (Sophomore)</option>
                                    <option value="3">3rd Year (Junior)</option>
                                    <option value="4">4th Year (Senior)</option>
                                    <option value="Postgraduate">Postgraduate</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('year')}" th:errors="*{year}">
                                    Year is required
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="col-md-12">
                                <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                                <input type="password" th:field="*{password}" class="form-control" id="password" 
                                       placeholder="Minimum 6 characters" 
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                                    Password must be at least 6 characters
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                            <a th:href="@{/login}" class="btn btn-outline-secondary">
                                <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fa-solid fa-user-check me-1"></i> Register Account
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
